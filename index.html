<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Inkubator Telur Puyuh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chosen Palette: Slate, Amber & Blue -->
    <!-- Application Structure Plan: SPA ini dirancang untuk monitoring real-time dengan "Fixed Y-Axes". Struktur utamanya menggunakan layout flexbox untuk bagian tren: 1) Kolom kiri statis untuk skala Suhu. 2) Area tengah scrollable untuk data grafik dan Waktu. 3) Kolom kanan statis untuk skala Kelembaban. Interval update diatur menjadi 5 detik dengan batas 25 titik data sesuai permintaan terbaru. -->
    <!-- Visualization & Content Choices: 1) Doughnut Chart (Canvas) untuk Gauge. 2) Status Indicators (HTML/CSS) untuk aktuator. 3) Line Chart (Canvas) dengan Y-axis statis (judul dan angka skala tetap di tempat saat digeser). Titik data bulat interaktif tetap dipertahankan dengan tooltip detail. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
        }
        .btn-mode {
            transition: all 0.2s ease;
            border: 2px solid #e2e8f0;
            font-weight: 700;
        }
        .btn-active {
            background-color: #334155;
            color: white;
            border-color: #334155;
            box-shadow: 0 4px 12px rgba(51, 65, 85, 0.25);
        }
        .gauge-container {
            position: relative;
            width: 100%;
            height: 150px;
        }
        .gauge-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.75rem;
            font-weight: 800;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Fixed Y-Axis Layout */
        .trend-container {
            display: flex;
            align-items: flex-start;
            height: 400px;
            position: relative;
        }
        .y-axis-static {
            width: 60px;
            height: 330px; /* Sesuai area grafik di canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 35px; /* Kompensasi untuk area label X */
            background: white;
            z-index: 10;
        }
        .axis-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: #64748b;
        }
        .scale-numbers {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            text-align: right;
            padding: 5px 0;
        }

        .scroll-chart-area {
            flex: 1;
            overflow-x: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        .scroll-chart-area::-webkit-scrollbar {
            height: 6px;
        }
        .scroll-chart-area::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .chart-inner-wrapper {
            height: 380px;
            /* Width akan diatur dinamis via JS agar per titik punya ruang luas */
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        
        <!-- Header & Kontrol -->
        <header class="mb-8 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-6 uppercase tracking-tight">Monitoring Inkubator Puyuh</h1>
            <div class="flex flex-wrap justify-center gap-3">
                <button id="btn-jantan" onclick="updateMode('jantan')" class="btn-mode px-6 py-3 rounded-2xl text-sm bg-white hover:border-slate-400">
                    MODE JANTAN (< 27°C)
                </button>
                <button id="btn-betina" onclick="updateMode('betina')" class="btn-mode px-6 py-3 rounded-2xl text-sm bg-white hover:border-slate-400">
                    MODE BETINA (< 30°C)
                </button>
                <button id="btn-normal" onclick="updateMode('normal')" class="btn-mode px-6 py-3 rounded-2xl text-sm bg-white hover:border-slate-400">
                    MODE NORMAL (29°C)
                </button>
            </div>
            <p id="info-status" class="mt-4 text-slate-500 font-medium"></p>
        </header>

        <!-- Status & Gauges -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="card flex flex-col justify-center">
                <h3 class="text-center text-slate-500 font-bold uppercase text-xs tracking-widest mb-6">Status Perangkat</h3>
                <div class="space-y-6 px-4">
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-slate-600">Lampu Pemanas</span>
                        <div class="flex items-center gap-2">
                            <span id="pemanas-dot" class="status-dot bg-slate-300"></span>
                            <span id="pemanas-label" class="font-bold text-slate-400">OFF</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-slate-600">Kipas Sirkulasi</span>
                        <div class="flex items-center gap-2">
                            <span class="status-dot bg-emerald-500"></span>
                            <span class="font-bold text-emerald-600 uppercase">ON</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card text-center">
                <h3 class="text-slate-500 font-bold uppercase text-xs tracking-widest mb-4">Suhu Real-Time</h3>
                <div class="gauge-container">
                    <canvas id="canvasTemp"></canvas>
                    <div id="displayTemp" class="gauge-text text-orange-500">--.-°C</div>
                </div>
            </div>

            <div class="card text-center">
                <h3 class="text-slate-500 font-bold uppercase text-xs tracking-widest mb-4">Kelembaban Real-Time</h3>
                <div class="gauge-container">
                    <canvas id="canvasHumid"></canvas>
                    <div id="displayHumid" class="gauge-text text-blue-600">--.-%</div>
                </div>
            </div>
        </div>

        <!-- Tren Data dengan Fixed Axes -->
        <div class="card">
            <h3 class="text-slate-500 font-bold uppercase text-xs tracking-widest mb-6 text-center">Tren Data (Geser untuk Histori)</h3>
            
            <div class="trend-container">
                <!-- Sumbu Y Kiri Statis (Suhu) -->
                <div class="y-axis-static">
                    <div class="axis-title text-orange-500">Suhu (°C)</div>
                    <div class="scale-numbers">
                        <span>40</span><span>38</span><span>36</span><span>34</span><span>32</span><span>30</span><span>28</span><span>26</span><span>24</span><span>22</span><span>20</span>
                    </div>
                </div>

                <!-- Area Grafik Scrollable -->
                <div id="scrollContainer" class="scroll-chart-area">
                    <div id="chartScrollArea" class="chart-inner-wrapper">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>

                <!-- Sumbu Y Kanan Statis (Kelembaban) -->
                <div class="y-axis-static">
                    <div class="axis-title text-blue-600" style="writing-mode: vertical-lr; transform: rotate(0deg);">Kelembaban (%)</div>
                    <div class="scale-numbers">
                        <span>80</span><span>74</span><span>68</span><span>62</span><span>56</span><span>50</span><span>44</span><span>38</span><span>32</span><span>26</span><span>20</span>
                    </div>
                </div>
            </div>

            <div class="mt-4 flex justify-center gap-8 text-[10px] font-bold uppercase tracking-wider">
                <div class="flex items-center gap-2 text-orange-500">
                    <div class="w-6 h-1 bg-orange-500 rounded-full"></div> Suhu
                </div>
                <div class="flex items-center gap-2 text-blue-600">
                    <div class="w-6 h-1 bg-blue-600 rounded-full"></div> Kelembaban
                </div>
            </div>
        </div>

    </div>

    <script>
        const MODE_SETTINGS = {
            'jantan': { target: 26.5, info: "Target Suhu Jantan: < 27.0°C" },
            'betina': { target: 29.5, info: "Target Suhu Betina: < 30.0°C" },
            'normal': { target: 29.0, info: "Target Suhu Normal: 29.0°C" }
        };

        let currentMode = 'normal';
        let sensorTemp = 25.0; 
        let sensorHumid = 50.0; 
        let labels = [];
        let dataTemp = [];
        let dataHumid = [];
        
        const MAX_POINTS = 25; 

        // Inisialisasi Gauges
        const initGauge = (id, color, max) => {
            return new Chart(document.getElementById(id), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [0, max],
                        backgroundColor: [color, '#f1f5f9'],
                        borderWidth: 0,
                        circumference: 180,
                        rotation: 270,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '85%',
                    plugins: { tooltip: { enabled: false }, legend: { display: false } }
                }
            });
        };

        const gaugeT = initGauge('canvasTemp', '#f97316', 50);
        const gaugeH = initGauge('canvasHumid', '#2563eb', 100);

        // Inisialisasi Grafik Tren (Tanpa Label Y karena sudah dibuat manual secara statis)
        const ctxTrend = document.getElementById('historyChart').getContext('2d');
        const trendChart = new Chart(ctxTrend, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Suhu',
                        data: dataTemp,
                        borderColor: '#f97316',
                        backgroundColor: 'rgba(249, 115, 22, 0.05)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 10,
                        pointBackgroundColor: '#f97316',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        tension: 0.4,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Kelembaban',
                        data: dataHumid,
                        borderColor: '#2563eb',
                        backgroundColor: 'rgba(37, 99, 235, 0.05)',
                        borderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 10,
                        pointBackgroundColor: '#2563eb',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        tension: 0.4,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: { top: 15, bottom: 5 }
                },
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,
                        displayColors: true,
                        callbacks: {
                            label: (ctx) => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}${ctx.datasetIndex === 0 ? '°C' : '%'}`
                        }
                    }
                },
                scales: {
                    x: { 
                        grid: { display: true, color: '#f1f5f9' }, 
                        ticks: { font: { weight: '600', size: 10 } }
                    },
                    y: { 
                        display: false, // Disembunyikan karena sudah ada versi statis
                        min: 20, max: 40 
                    },
                    y1: { 
                        display: false, // Disembunyikan karena sudah ada versi statis
                        min: 20, max: 80 
                    }
                }
            }
        });

        window.updateMode = (mode) => {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('btn-active'));
            document.getElementById(`btn-${mode}`).classList.add('btn-active');
            document.getElementById('info-status').textContent = MODE_SETTINGS[mode].info;
        };

        function mainLoop() {
            const target = MODE_SETTINGS[currentMode].target;
            
            // Logika Kontrol Lampu
            if (sensorTemp < (target - 0.1)) {
                sensorTemp += Math.random() * 0.2;
                document.getElementById('pemanas-dot').className = "status-dot bg-amber-500";
                document.getElementById('pemanas-label').className = "font-bold text-amber-600";
                document.getElementById('pemanas-label').textContent = "ON";
            } else {
                sensorTemp -= Math.random() * 0.08;
                document.getElementById('pemanas-dot').className = "status-dot bg-slate-300";
                document.getElementById('pemanas-label').className = "font-bold text-slate-400";
                document.getElementById('pemanas-label').textContent = "OFF";
            }

            // Simulasi Kelembaban
            sensorHumid += (Math.random() - 0.5) * 0.6;
            if (sensorHumid < 40) sensorHumid += 0.5;
            if (sensorHumid > 60) sensorHumid -= 0.5;

            // Update Teks & Gauges
            document.getElementById('displayTemp').textContent = `${sensorTemp.toFixed(1)}°C`;
            document.getElementById('displayHumid').textContent = `${sensorHumid.toFixed(1)}%`;
            gaugeT.data.datasets[0].data = [sensorTemp, 50 - sensorTemp];
            gaugeT.update('none');
            gaugeH.data.datasets[0].data = [sensorHumid, 100 - sensorHumid];
            gaugeH.update('none');

            // Update Grafik Tren
            const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            if (labels.length >= MAX_POINTS) {
                labels.shift();
                dataTemp.shift();
                dataHumid.shift();
            }
            labels.push(timestamp);
            dataTemp.push(sensorTemp);
            dataHumid.push(sensorHumid);

            // Atur lebar grafik agar bergeser
            const scrollArea = document.getElementById('chartScrollArea');
            const pointSpacing = 70; // Jarak antar titik cukup lebar agar tidak menumpuk
            const calculatedWidth = labels.length * pointSpacing;
            
            if (calculatedWidth > scrollArea.parentElement.offsetWidth) {
                scrollArea.style.width = calculatedWidth + 'px';
            } else {
                scrollArea.style.width = '100%';
            }

            trendChart.update('none');

            // Auto-scroll ke paling kanan (data terbaru)
            const container = document.getElementById('scrollContainer');
            container.scrollLeft = container.scrollWidth;
        }

        updateMode('normal');
        setInterval(mainLoop, 5000); // Update tiap 5 detik
    </script>
</body>
</html>
